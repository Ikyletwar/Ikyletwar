<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Hizkia Letwar — Nihongo-Web">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', 'Iowan Old Style', serif; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
    </style>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1ea"/>
      <stop offset="100%" stop-color="#d9d2c5"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="1200" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#141311"/>
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#2a2723" stroke-width="1"/>

  <!-- subtle moving rule -->
  <g opacity="0.55">
    <line x1="80" y1="330" x2="1120" y2="330" stroke="#3a3630" stroke-width="1"/>
    <rect x="80" y="328.5" width="120" height="3" fill="#b9a37a">
      <animate attributeName="x" values="80;1000;80" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <animate attributeName="opacity" values="0.0;0.9;0.9;0.0" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.92;1"/>
    </rect>
  </g>

  <!-- top label -->
  <g class="mono" fill="#8f877b" font-size="12" letter-spacing="3">
    <text x="80" y="76">PROFIL / PEMBARUAN BERKALA</text>
    <text x="1120" y="76" text-anchor="end">MALUKU TENGAH, INDONESIA</text>
  </g>

  <!-- kinetic name reveal -->
  <g clip-path="url(#reveal)">
    <text x="80" y="170" class="serif" font-size="86" fill="url(#ink)" letter-spacing="-1">Hizkia Letwar</text>
    <text x="80" y="220" class="sans" font-size="24" fill="#b9a37a" letter-spacing="4">NIHONGO-WEB</text>
  </g>

  <!-- subtitle fade -->
  <g class="sans" font-size="18" fill="#a9a195">
    <text x="80" y="262" opacity="0">
      XI TJKT 1 · SMK Negeri 1 Maluku Tengah
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.9s" fill="freeze"/>
      <animate attributeName="y" from="270" to="262" dur="0.9s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
    </text>
    <text x="80" y="292" opacity="0" fill="#7f786f">
      Web &amp; PWA · Android Kotlin/Compose · alat sekolah · reverse engineering
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.15s" fill="freeze"/>
      <animate attributeName="y" from="300" to="292" dur="0.9s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
    </text>
  </g>

  <!-- right side rotating keywords -->
  <g class="mono" font-size="13" fill="#6f685f" letter-spacing="2">
    <text x="1120" y="170" text-anchor="end">
      <tspan id="k1">STATIC-FIRST</tspan>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="198" text-anchor="end">
      <tspan>OFFLINE-READY</tspan>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="226" text-anchor="end">
      <tspan>MOBILE-FIRST</tspan>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="254" text-anchor="end">
      <tspan>CAREFUL CRAFT</tspan>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- bottom note -->
  <g class="mono" font-size="11" fill="#645d55" letter-spacing="2">
    <text x="80" y="360">SCROLL UNTUK KARYA, PROSES, DAN INDEKS REPO</text>
    <text x="1120" y="360" text-anchor="end">EDITORIAL / MOTION / RESTRAINT</text>
  </g>
</svg>
