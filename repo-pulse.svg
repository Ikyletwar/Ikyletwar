  <text x="36" y="184" font-family="Arial, sans-serif" font-size="12" fill="#475569">Active since Mar 2026 · Updated 03 Nov 2026</text>
  <text x="36" y="207" font-family="Arial, sans-serif" font-size="12" fill="#475569">128 contributions in the last year</text>

  <rect x="250" y="72" width="240" height="164" rx="16" fill="#ffffff" opacity="0.72" stroke="#cbd5e1"/>
  <text x="272" y="103" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">SNAPSHOT</text>
  <text x="272" y="133" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">9</text><text x="297" y="133" font-family="Arial, sans-serif" font-size="12" fill="#475569"> live demos</text>
  <text x="272" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">0</text><text x="286" y="160" font-family="Arial, sans-serif" font-size="12" fill="#475569"> open issues</text>
