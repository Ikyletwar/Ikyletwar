<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="Ikyletwar public repository pulse, November 2026">
  <title>Ikyletwar — Repo Pulse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75"><stop offset="0" stop-color="#0891b2" stop-opacity="0.22"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e2e8f0" opacity="0.75"/></pattern>
  </defs>
  <style>
    @keyframes drift { 0% { transform: translateX(-360px); opacity: 0 } 15% { opacity: .55 } 45% { opacity: .55 } 100% { transform: translateX(1180px); opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .scan { animation: drift 4.8s ease-in-out infinite; transform-origin: center; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .bar { transition: width .4s ease; }
    text { letter-spacing: .2px; }
  </style>
  <rect width="980" height="300" rx="22" fill="url(#bg)"/>
  <rect width="980" height="300" rx="22" fill="url(#dots)" opacity="0.55"/>
  <rect width="980" height="300" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="978" height="298" rx="21" fill="none" stroke="#cbd5e1"/>
  <rect class="scan" x="0" y="26" width="180" height="248" fill="#0891b2" opacity="0.10" transform="skewX(-18)"/>

  <text x="36" y="44" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0891b2" letter-spacing="2.4">@IKYLETWAR / REPO PULSE</text>
  <circle class="live" cx="916" cy="39" r="5" fill="#047857"/>
  <text x="904" y="44" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">LIVE</text>

