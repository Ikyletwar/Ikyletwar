  <text x="560" y="156" font-family="Arial, sans-serif" font-size="12" fill="#475569">Kotlin</text><rect x="672" y="145" width="280" height="10" rx="5" fill="#e2e8f0"/><rect class="bar" x="672" y="145" width="25" height="10" rx="5" fill="#7c3aed"/><text x="964" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2</text>
